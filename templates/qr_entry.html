{% extends 'base.html' %}

{% block title %}Welcome - QR Attend{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center -mt-10">
    <div class="text-center w-full max-w-4xl px-4 animate-in">
        
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 mb-8">
            <span class="w-2 h-2 rounded-full bg-blue-500 pulse-glow"></span>
            <span class="text-sm font-medium tracking-wide">Select Your Role</span>
        </div>
        
        <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6 tracking-tight">
            Welcome to <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-500">QR Attend</span>
        </h1>
        
        <p class="text-slate-400 text-lg mb-12 max-w-2xl mx-auto">
            Choose your portal below to proceed.
        </p>
        
        <div class="grid md:grid-cols-2 gap-6 max-w-2xl mx-auto">
            
            <!-- Faculty Card -->
            <a href="{% url 'faculty_login' %}" class="group relative bg-[#121326] border border-glass rounded-2xl p-8 hover:border-blue-500/50 transition-all duration-300 hover:shadow-[0_0_30px_rgba(59,130,246,0.15)] overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-blue-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-blue-500/20 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-chalkboard-user text-3xl text-blue-400"></i>
                </div>
                
                <h2 class="text-2xl font-bold text-white mb-2">Faculty</h2>
                <p class="text-slate-400 text-sm">Access the dashboard and command center.</p>
            </a>
            
            <!-- Student Card -->
            <a href="{% url 'mark_attendance' qr_token=qr_token %}" class="group relative bg-[#121326] border border-glass rounded-2xl p-8 hover:border-emerald-500/50 transition-all duration-300 hover:shadow-[0_0_30px_rgba(16,185,129,0.15)] overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-emerald-500/20 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-user-graduate text-3xl text-emerald-400"></i>
                </div>
                
                <h2 class="text-2xl font-bold text-white mb-2">Student</h2>
                <p class="text-slate-400 text-sm">Quickly mark your attendance from the list.</p>
            </a>
            
        </div>
    </div>
</div>
{% endblock %}
